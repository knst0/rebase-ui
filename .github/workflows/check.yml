name: Check

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to verify. Defaults to the calling workflow's ref.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-node

      - run: pnpm fmt --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --prod --audit-level high

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ci
      - run: pnpm test:package

      - run: pnpm --filter @rebase-ui/docs build
      - run: pnpm --filter @rebase-ui/solid bundle:size

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      # actionlint also runs the preinstalled shellcheck on every `run:` block.
      - run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) && ./actionlint -color

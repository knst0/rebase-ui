name: Docs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build the docs from (empty = the branch selected when running the workflow)"
        required: false
        type: string
        default: ""
      base:
        description: "Vite base path ('/' for a custom domain, '/rebase-ui/' for the project page)"
        required: false
        type: string
        default: "/"
      cname:
        description: "Custom domain written to the CNAME file (empty for the default github.io URL)"
        required: false
        type: string
        default: "rebase.ui.knst.dev"

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-node

      - name: Resolve the docs base path
        run: |
          base="${{ inputs.base }}"
          [ -n "$base" ] || base="/"
          case "$base" in /*) ;; *) base="/$base" ;; esac
          case "$base" in */) ;; *) base="$base/" ;; esac
          echo "DOCS_BASE=$base" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.cname }}" ]; then
            echo "DOCS_URL=https://${{ inputs.cname }}" >> "$GITHUB_ENV"
          else
            echo "DOCS_URL=https://knst0.github.io" >> "$GITHUB_ENV"
          fi

      - name: Build the docs
        run: pnpm --filter @rebase-ui/docs exec vite build

      - name: Prepare the Pages artifact
        run: |
          cp docs/dist/client/index.html docs/dist/client/404.html
          touch docs/dist/client/.nojekyll
          if [ -n "${{ inputs.cname }}" ]; then
            printf '%s\n' "${{ inputs.cname }}" > docs/dist/client/CNAME
          fi

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/dist/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Bump and verify, but do not publish, tag or deploy docs"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      core_name: ${{ steps.plan.outputs.core_name }}
      core_dir: ${{ steps.plan.outputs.core_dir }}
      core_version: ${{ steps.plan.outputs.core_version }}
      core_tag: ${{ steps.plan.outputs.core_tag }}
      reze_name: ${{ steps.plan.outputs.reze_name }}
      reze_dir: ${{ steps.plan.outputs.reze_dir }}
      reze_version: ${{ steps.plan.outputs.reze_version }}
      reze_tag: ${{ steps.plan.outputs.reze_tag }}
      solid_name: ${{ steps.plan.outputs.solid_name }}
      solid_dir: ${{ steps.plan.outputs.solid_dir }}
      solid_version: ${{ steps.plan.outputs.solid_version }}
      solid_tag: ${{ steps.plan.outputs.solid_tag }}
      tags: ${{ steps.plan.outputs.tags }}
      summary: ${{ steps.plan.outputs.summary }}
      sha: ${{ steps.branch.outputs.sha }}
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Bump the versions
        run: |
          git ls-files '.changeset/*.md' | grep -qv '^.changeset/README.md$' ||
            { echo "::error::no pending changesets; nothing to release"; exit 1; }

          pnpm changeset version

      # Every package that actually changed gets its own version, tag and
      # release job. Packages untouched by the pending changesets keep their
      # current version and are not published again.
      - id: plan
        name: Resolve the per-package release plan
        run: node .github/scripts/release-plan.mjs

      - id: branch
        name: Commit the release on a branch
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
        run: |
          branch="release/run-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore(release): ${TAGS}"
          # The branch is owned by this workflow; a previous (dry) run may have left it behind.
          git push --force --set-upstream origin "$branch"

          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify the release commit
    permissions:
      contents: read
    needs: prepare
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # The packages are built, published and tagged independently. A changeset for
  # @rebase-ui/reze no longer requires a new @rebase-ui/solid version, and each
  # package gets its own tag (e.g. @rebase-ui/reze@0.1.3).
  publish_core:
    name: Publish core
    needs: [prepare, verify]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.core_tag != '' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-package.yml
    with:
      package-name: ${{ needs.prepare.outputs.core_name }}
      package-dir: ${{ needs.prepare.outputs.core_dir }}
      package-version: ${{ needs.prepare.outputs.core_version }}
      tag: ${{ needs.prepare.outputs.core_tag }}
      sha: ${{ needs.prepare.outputs.sha }}
      dry-run: ${{ inputs.dry-run }}

  publish_reze:
    name: Publish reze
    needs: [prepare, verify, publish_core]
    # publish_core is skipped when core did not change; that must not block reze.
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.reze_tag != '' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-package.yml
    with:
      package-name: ${{ needs.prepare.outputs.reze_name }}
      package-dir: ${{ needs.prepare.outputs.reze_dir }}
      package-version: ${{ needs.prepare.outputs.reze_version }}
      tag: ${{ needs.prepare.outputs.reze_tag }}
      sha: ${{ needs.prepare.outputs.sha }}
      dry-run: ${{ inputs.dry-run }}

  publish_solid:
    name: Publish solid
    needs: [prepare, verify, publish_core]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.solid_tag != '' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-package.yml
    with:
      package-name: ${{ needs.prepare.outputs.solid_name }}
      package-dir: ${{ needs.prepare.outputs.solid_dir }}
      package-version: ${{ needs.prepare.outputs.solid_version }}
      tag: ${{ needs.prepare.outputs.solid_tag }}
      sha: ${{ needs.prepare.outputs.sha }}
      dry-run: ${{ inputs.dry-run }}

  sync:
    name: Open or update the sync PR
    needs: [prepare, publish_core, publish_reze, publish_solid]
    if: ${{ always() && !cancelled() && !failure() && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAGS: ${{ needs.prepare.outputs.tags }}
      SUMMARY: ${{ needs.prepare.outputs.summary }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Open or update the sync PR into main
        run: |
          {
            printf 'Released packages:\n\n%s\n\n---\n\n' "$SUMMARY"
            printf 'Post-release sync: version bumps, changelogs and consumed changesets for '
            printf '%s, already published and tagged.\n\n' "$TAGS"
            printf 'Merge (do not squash) to keep the tagged commits reachable from main.\n'
          } > body.md
          title="chore(release): ${TAGS}"
          gh pr create --base main --head "$BRANCH" --title "$title" --body-file body.md ||
            gh pr edit "$BRANCH" --title "$title" --body-file body.md

  # Events from GITHUB_TOKEN never trigger other workflows, so the docs
  # deploy is called directly instead of listening for the release.
  docs:
    name: Rebuild docs
    needs: [prepare, publish_core, publish_reze, publish_solid]
    if: ${{ always() && !cancelled() && !failure() && !inputs.dry-run }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
